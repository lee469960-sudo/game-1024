<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101c18">
  <title>贪吃蛇 · SNAKE</title>
  <link rel="stylesheet" href="styles.css">
  <script src="game.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <nav><a href="../index.html">↖ 返回 1024</a><span class="edition">ARCADE / 002</span></nav>
    <header><div><p class="eyebrow"><i></i> ONE MORE BITE</p><h1>贪吃蛇<span> SNAKE</span></h1></div><div class="scores"><div>得分<output id="score">0</output></div><div>最高<output id="best">0</output></div></div></header>
    <div class="toolbar"><span id="status">准备出发</span><span>20 × 20 <b>·</b> 经典模式</span></div>
    <div class="arena">
      <canvas id="board" width="600" height="600" tabindex="0" role="img" aria-label="贪吃蛇游戏棋盘" aria-describedby="instructions">你的浏览器需要支持 Canvas 才能游玩。</canvas>
      <section id="overlay" aria-labelledby="overlay-title"><span class="mark" aria-hidden="true">↗</span><h2 id="overlay-title">下一口，会更长。</h2><p id="overlay-text">吃掉橙色食物，避开墙壁和自己。</p><button id="start" type="button">开始游戏 <span aria-hidden="true">→</span></button></section>
    </div>
    <div class="actions"><button id="pause" class="secondary" type="button" disabled>暂停 <kbd>SPACE</kbd></button><button id="restart" class="secondary" type="button">重新开始 ↻</button></div>
    <div class="direction-pad" aria-label="方向控制"><button data-direction="up" class="up" type="button" aria-label="向上">↑</button><button data-direction="left" type="button" aria-label="向左">←</button><button data-direction="down" type="button" aria-label="向下">↓</button><button data-direction="right" type="button" aria-label="向右">→</button></div>
    <p id="instructions"><strong>跟着直觉走，记得留条退路。</strong><br>方向键 / WASD 转向，也可滑动棋盘或点击方向按钮。空格暂停，每口 +10 分；撞墙或撞到自己就结束。</p>
    <p id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
    <footer><span>没有终点，只有下一口。</span><a href="../shooter/index.html">玩打飞机 →</a></footer>
  </main>
</body>
</html>
